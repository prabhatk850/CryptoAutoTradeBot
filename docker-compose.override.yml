# Local dev, auto-merged by `docker compose up`: build from source with hot reload.
# Every saved backend file reloads the LIVE bot — create a new module before adding its import.
services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules          # keep the container's Linux node_modules
      - /app/.next                 # keep dev output out of the host tree
    environment:
      - WATCHPACK_POLLING=true     # Windows bind mounts don't deliver file events
