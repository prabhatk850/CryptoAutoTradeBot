# Base stack = published images; what a server runs. Locally, docker-compose.override.yml is merged in automatically.
# Server: docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d
services:
  backend:
    image: prabhatk850/forexbot:backend-latest
    container_name: forex_backend
    ports:
      - "8000:8000"
    env_file: .env                 # read only when the container is created: `up -d --force-recreate backend`
    dns: [1.1.1.1, 8.8.8.8]        # Docker's resolver intermittently drops Atlas SRV lookups
    restart: unless-stopped

  frontend:
    image: prabhatk850/forexbot:frontend-latest
    container_name: forex_frontend
    ports:
      - "4000:4000"                # the only port that must be public; /api is proxied to backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:                         # opt-in local DB (`--profile localdb`); production uses Atlas via MONGO_URI
    image: mongo:7
    container_name: forex_mongo
    profiles: [localdb]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: forexbot
    restart: unless-stopped

volumes:
  mongo_data:
